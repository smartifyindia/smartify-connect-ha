# Builds the Smartify Connect container for Docker users (amd64 + arm64) on every change to the App.
name: Container image

on:
  push:
    branches: [main]
    paths: ['smartify_connect/**', '.github/workflows/image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version from config.yaml
        id: v
        run: echo "version=$(grep '^version:' smartify_connect/config.yaml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: smartify_connect
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/smartifyindia/smartify-connect:${{ steps.v.outputs.version }}
            ghcr.io/smartifyindia/smartify-connect:latest
