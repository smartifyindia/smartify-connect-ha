# Home Assistant App ("add-on"). https://developers.home-assistant.io/docs/add-ons/configuration
name: Smartify Connect
version: "0.3.1"
slug: smartify_connect
description: Control this Home Assistant's devices from the Smartify Home app. Outbound connection only; no ports are opened.
url: https://github.com/smartifyindia/smartify-connect-ha
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Talks to Home Assistant's WebSocket API with the token the Supervisor injects: no token to create.
homeassistant_api: true
# The "Smartify" page in the sidebar: status, and the pairing code with its QR.
ingress: true
ingress_port: 8099
panel_icon: mdi:home-automation
panel_title: Smartify
options: {}
schema:
  smartify_url: url?
